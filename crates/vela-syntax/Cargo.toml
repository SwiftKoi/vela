[package]
name = "vela-syntax"
description = "The lexer and parser: `.vela` source text to a concrete syntax tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.vela]
rank = 2

[dependencies]
vela-span.workspace = true
# For one thing only: the text-tag vocabulary, so the parser and the renderer cannot disagree
# about which tags exist (`vela-text::tags`). A second list in the parser is how `{/}` comes to
# mean one thing to the checker and another to the presenter.
vela-text.workspace = true
vela-diag.workspace = true

[lints]
workspace = true

[dev-dependencies]
vela-diag = { path = "../vela-diag" }
