[package]
name = "vela-cli"
description = "The `vela` binary and its subcommand registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.vela]
rank = 10

# The binary is `vela`, not `vela-cli`: the package name follows the crate prefix
# convention, the command users type does not.
[[bin]]
name = "vela"
path = "src/main.rs"

[dependencies]
vela-span.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
vela-diag.workspace = true
vela-syntax = { version = "0.1.0", path = "../vela-syntax" }
vela-compile.workspace = true
vela-mir.workspace = true
vela-bytecode.workspace = true
vela-vm.workspace = true
vela-replay.workspace = true
vela-assets.workspace = true
vela-host.workspace = true
vela-lsp.workspace = true
vela-test.workspace = true
vela-migrate.workspace = true
vela-render = { version = "0.1.0", path = "../vela-render" }
vela-text = { version = "0.1.0", path = "../vela-text" }
vela-world = { version = "0.1.0", path = "../vela-world" }
vela-ui = { version = "0.1.0", path = "../vela-ui" }

[lints]
workspace = true
